[package]
name = "ombifest-cli"
version = "1.0.0"
edition = "2021"
description = "Rust CLI for Ombist TLS leaf pin and signed manifests (Swift-compatible)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ombist/ombist"

[[bin]]
name = "ombifest"
path = "src/main.rs"

[lib]
name = "ombifest_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
pem = "3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"
sha2 = "0.10"

[profile.release]
strip = true
